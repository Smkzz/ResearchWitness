name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run static lint checks
        run: python -m ruff check .
      - name: Run tests
        run: python -m coverage run -m pytest -q
      - name: Report line and branch coverage
        run: python -m coverage report
      - name: Enforce verifier-core coverage
        run: python -m coverage report --include='researchwitness/*.py' --fail-under=90
      - name: Run synthetic conformance benchmark
        run: python benchmarks/run_synthetic.py
      - name: Replay historical MVP cases
        run: python validation/mvp_real/run_validation.py

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run offline release qualification
        run: python tools/quality_gate.py
      - name: Build review artifacts from the qualified source inventory
        run: |
          python tools/make_release.py --output-dir "$RUNNER_TEMP/researchwitness-review"
          git diff --exit-code -- CHECKSUMS.sha256
          git rev-parse HEAD > "$RUNNER_TEMP/researchwitness-review/source-commit.txt"
      - name: Retain public review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: researchwitness-review-${{ github.sha }}
          path: ${{ runner.temp }}/researchwitness-review/
          if-no-files-found: error
          retention-days: 7
