name: Dependency evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install declared build backend
        run: |
          python -m venv .dependency-venv
          .dependency-venv/bin/python -m pip install --report backend-install.json 'setuptools>=68'
      - name: Resolve development dependencies and record distribution hashes
        run: .dependency-venv/bin/python -m pip install --report dependency-install.json --no-build-isolation -e '.[dev]'
      - name: Capture distributed licenses and query current package advisories
        run: .dependency-venv/bin/python tools/dependency_review.py --output dependency-evidence --print-license-evidence
      - name: Retain public dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-evidence
          path: |
            backend-install.json
            dependency-install.json
            dependency-evidence/
          if-no-files-found: error
          retention-days: 30
